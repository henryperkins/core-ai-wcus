name: Verify booth release build

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
            - run: npm ci
            - run: npm run lint:js -- --no-fix
            - run: npm run lint:css
            - run: npm run test:unit -- --runInBand
            - run: npm run test:playground
            - run: npm run build
            - run: git diff --exit-code -- build
            - run: npm run plugin-zip
            - run: npm run create:playground-source-fixture -- "$RUNNER_TEMP/playground-static-source"
            - run: npm run build:playground -- --source "$RUNNER_TEMP/playground-static-source" --output dist-playground --source-commit "${{ github.sha }}"
            - run: npm run verify:playground-artifact -- --directory dist-playground --source-commit "${{ github.sha }}"
